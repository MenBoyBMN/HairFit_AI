<!DOCTYPE html>
<html lang="vi">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HairFit AI — Nền tảng đặt lịch cắt tóc thông minh, tìm kiếm salon & tư vấn kiểu tóc chuẩn tỉ lệ khuôn mặt trên Web & Mobile.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HairFit AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HairFit AI — Đặt Lịch Salon & Tư Vấn Kiểu Tóc</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #F5F6FA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading-indicator {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1A1A2E 0%, #16213E 100%);
      color: #FFFFFF;
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }
    .brand-badge {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: rgba(233, 69, 96, 0.16);
      border: 1.5px solid rgba(233, 69, 96, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      box-shadow: 0 14px 32px rgba(233, 69, 96, 0.25);
      animation: floatBadge 2.4s ease-in-out infinite;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #E94560;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .brand-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.4px;
      margin-bottom: 6px;
    }
    .brand-subtitle {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes floatBadge {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="brand-badge">
      <div class="spinner"></div>
    </div>
    <div class="brand-title">HairFit AI</div>
    <div class="brand-subtitle">Đang khởi tạo không gian Salon & Web Studio...</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () {
          loader.remove();
        }, 400);
      }
    });

    // =========================================================================
    // On-Device Web Face Detection & Anthropometric Analyzer (MediaPipe Vision)
    // =========================================================================
    window._hairfitFaceLandmarkerPromise = null;

    async function _getHairfitFaceLandmarker() {
      if (window._hairfitFaceLandmarkerPromise) {
        return window._hairfitFaceLandmarkerPromise;
      }
      window._hairfitFaceLandmarkerPromise = (async () => {
        try {
          const visionModule = await import(
            'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs'
          );
          const { FaceLandmarker, FilesetResolver } = visionModule;
          const filesetResolver = await FilesetResolver.forVisionTasks(
            'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
          );
          try {
            return await FaceLandmarker.createFromOptions(filesetResolver, {
              baseOptions: {
                modelAssetPath:
                  'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
                delegate: 'GPU',
              },
              runningMode: 'IMAGE',
              numFaces: 5,
              minFaceDetectionConfidence: 0.55,
              minFacePresenceConfidence: 0.55,
            });
          } catch (_) {
            return await FaceLandmarker.createFromOptions(filesetResolver, {
              baseOptions: {
                modelAssetPath:
                  'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
                delegate: 'CPU',
              },
              runningMode: 'IMAGE',
              numFaces: 5,
              minFaceDetectionConfidence: 0.55,
              minFacePresenceConfidence: 0.55,
            });
          }
        } catch (err) {
          window._hairfitFaceLandmarkerPromise = null;
          throw err;
        }
      })();
      return window._hairfitFaceLandmarkerPromise;
    }

    function _dist2D(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    window.hairfitAnalyzeFaceImage = async function (imageUrl) {
      try {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = () => reject(new Error('Không thể đọc dữ liệu hình ảnh'));
          img.src = imageUrl;
        });

        const maxDim = 1024;
        let w = img.naturalWidth || img.width || 640;
        let h = img.naturalHeight || img.height || 640;
        if (w > maxDim || h > maxDim) {
          const scale = maxDim / Math.max(w, h);
          w = Math.round(w * scale);
          h = Math.round(h * scale);
        }

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);

        const landmarker = await _getHairfitFaceLandmarker();
        const detectionResult = landmarker.detect(canvas);
        const faces = (detectionResult && detectionResult.faceLandmarks) || [];

        if (faces.length === 0) {
          return JSON.stringify({
            isValid: false,
            errorMessage: 'Không phát hiện khuôn mặt trong ảnh',
            errorHint:
              'Ảnh tải lên không có khuôn mặt người hợp lệ. Vui lòng chọn ảnh chân dung chụp rõ khuôn mặt nhìn thẳng.',
            faceCount: 0,
          });
        }

        // Chọn khuôn mặt có diện tích lớn nhất nếu trong ảnh có nhiều người
        let bestPts = null;
        let bestArea = -1;
        let bestBox = null;

        for (const lmList of faces) {
          const pts = lmList.map((p) => ({ x: p.x * w, y: p.y * h }));
          let minX = pts[0].x,
            maxX = pts[0].x,
            minY = pts[0].y,
            maxY = pts[0].y;
          for (const pt of pts) {
            if (pt.x < minX) minX = pt.x;
            if (pt.x > maxX) maxX = pt.x;
            if (pt.y < minY) minY = pt.y;
            if (pt.y > maxY) maxY = pt.y;
          }
          const area = (maxX - minX) * (maxY - minY);
          if (area > bestArea) {
            bestArea = area;
            bestPts = pts;
            bestBox = {
              minX,
              maxX,
              minY,
              maxY,
              width: maxX - minX,
              height: maxY - minY,
            };
          }
        }

        // Kiểm tra kích thước khuôn mặt đủ lớn
        const areaRatio = bestArea / Math.max(1, w * h);
        if (bestBox.width < 80 || areaRatio < 0.025) {
          return JSON.stringify({
            isValid: false,
            errorMessage: 'Khuôn mặt trong ảnh quá nhỏ',
            errorHint:
              'Vui lòng chọn ảnh chân dung chụp gần hơn (khuôn mặt cần chiếm ít nhất 20% khung hình).',
            faceCount: faces.length,
          });
        }

        // Kiểm tra góc quay ngang (Euler Y / Yaw)
        const leftCheek = bestPts[234];
        const rightCheek = bestPts[454];
        const noseTip = bestPts[1];
        const cheekSpan = Math.max(1, rightCheek.x - leftCheek.x);
        const noseRelX = (noseTip.x - leftCheek.x) / cheekSpan;
        const eulerY = (noseRelX - 0.5) * 90.0;

        if (Math.abs(eulerY) > 20.0) {
          return JSON.stringify({
            isValid: false,
            errorMessage: 'Vui lòng chọn ảnh nhìn thẳng vào camera',
            errorHint:
              'Gương mặt trong ảnh đang bị nghiêng sang một bên (' +
              eulerY.toFixed(1) +
              '°). Hãy chọn ảnh chụp chính diện.',
            eulerY: eulerY,
            faceCount: faces.length,
          });
        }

        // Kiểm tra góc ngửa/cúi đầu (Euler X / Pitch)
        const foreheadTop = bestPts[10];
        const chinBottom = bestPts[152];
        const totalVertical = Math.max(1, chinBottom.y - foreheadTop.y);
        const noseRelY = (noseTip.y - foreheadTop.y) / totalVertical;
        const eulerX = (noseRelY - 0.58) * 75.0;

        if (Math.abs(eulerX) > 18.0) {
          return JSON.stringify({
            isValid: false,
            errorMessage: 'Vui lòng giữ đầu thẳng đứng',
            errorHint:
              'Khuôn mặt trong ảnh đang ngửa lên hoặc cúi xuống quá nhiều (' +
              eulerX.toFixed(1) +
              '°).',
            eulerX: eulerX,
            eulerY: eulerY,
            faceCount: faces.length,
          });
        }

        // Trích xuất 36 điểm viền ngoài khuôn mặt (Face Oval Contour tương đồng ML Kit)
        const faceOvalIdx = [
          10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365,
          379, 378, 400, 377, 152, 148, 176, 149, 150, 136, 172, 58, 132, 93,
          234, 127, 162, 21, 54, 103, 67, 109,
        ];
        const ovalPts = faceOvalIdx.map((idx) => bestPts[idx]);

        const faceHeight = _dist2D(bestPts[10], bestPts[152]);
        const cheekboneWidth = _dist2D(bestPts[234], bestPts[454]);
        const foreheadWidth = Math.max(
          _dist2D(bestPts[54], bestPts[284]),
          _dist2D(bestPts[103], bestPts[332])
        );
        const jawlineWidth = Math.max(
          _dist2D(bestPts[172], bestPts[397]),
          _dist2D(bestPts[132], bestPts[361])
        );
        const chinWidth = _dist2D(bestPts[149], bestPts[378]);

        return JSON.stringify({
          isValid: true,
          faceCount: faces.length,
          eulerX: eulerX,
          eulerY: eulerY,
          faceHeight: faceHeight,
          cheekboneWidth: cheekboneWidth,
          foreheadWidth: foreheadWidth,
          jawlineWidth: jawlineWidth,
          chinWidth: chinWidth,
          contourPointsCount: ovalPts.length,
        });
      } catch (e) {
        return JSON.stringify({
          isValid: false,
          errorMessage: 'Không thể nhận diện khuôn mặt từ bức ảnh này',
          errorHint:
            'Vui lòng kiểm tra kết nối mạng hoặc chọn ảnh chân dung rõ nét hơn (' +
            (e && e.message ? e.message : e) +
            ').',
          faceCount: 0,
        });
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
